; PlatformIO Project Configuration File
;
;   ESP32-S3R8N8 平衡轮腿可分离机械狗
;   主控：ESP32-S3R8N8
;   PSRAM：8MB Octal SPI
;   Flash：8MB

[env:esp32-s3-devkitc-1]
; 固定 platform 版本到 6.5.0 (已安装)
; 原因: 最新版 espressif32 (7.1.3) 要求的 toolchain-riscv32-esp @ 14.2.0+20251107
; 在 PlatformIO Registry 不存在 (官方最新是 15.2.0+20251204),
; PIO 会陷入死循环重试不存在的 URL.
; 6.5.0 依赖 toolchain-riscv32-esp @ 8.4.0+2021r2-patch5, 但 8.4.0 没有
; darwin_arm64 版本 (Apple Silicon); 我们手动升级到 12.2.0 (有 arm64).
platform = espressif32@~6.5.0
board = esp32-s3-devkitc-1
framework = espidf

; 工程源码目录: main/ (ESP-IDF 标准布局, 覆盖 PlatformIO 默认 src/)
[platformio]
src_dir = main

; 强制使用 darwin_arm64 支持的工具链版本
platform_packages =
    toolchain-riscv32-esp@12.2.0+20230208
    toolchain-xtensa-esp32s3@12.2.0+20230208

; Flash settings - ESP32-S3R8N8 配置
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.flash_mode = qio
board_build.partitions = partitions.csv

; PSRAM: 8MB Octal SPI PSRAM
board_build.psram_type = opi
board_build.arduino.memory_type = opi_opi

; Serial monitor
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
