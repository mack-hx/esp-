; PlatformIO Project Configuration File
;
;   ESP32-S3R8N8 平衡轮腿可分离机械狗
;   主控：ESP32-S3R8N8
;   PSRAM：8MB Octal SPI
;   Flash：8MB
;   8MB Flash 新分区表（见 partitions.csv）:
;     nvs 24K / otadata 8K / phy_init 4K / ota_0 3584K / ota_1 3584K / storage 896K

[env:esp32-s3-devkitc-1]
platform = espressif32@~6.5.0
board = esp32-s3r8n8-8mb
framework = espidf

; 强制使用 darwin_arm64 支持的工具链版本
platform_packages =
    toolchain-riscv32-esp@12.2.0+20230208
    toolchain-xtensa-esp32s3@12.2.0+20230208

; Flash settings - ESP32-S3R8N8 配置
; 注意: 下面两行只对 Arduino 框架有效, ESP-IDF 下 flash size 由 board JSON 的
; upload.flash_size (8MB) + sdkconfig 的 ESPTOOLPY_FLASHSIZE 决定, 保持一致即可
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.flash_mode = qio

; PSRAM: 8MB Octal SPI PSRAM
board_build.psram_type = opi
board_build.arduino.memory_type = opi_opi

; Serial monitor
monitor_speed = 230400
monitor_filters = esp32_exception_decoder

; JTAG 调试 (pio debug)
debug_tool = esp-builtin

; Upload settings - 解决烧录后串口断开问题
upload.speed = 460800
upload.wait_for_upload_port = true

[platformio]
; 工程源码目录: main/ (ESP-IDF 标准布局, 覆盖 PlatformIO 默认 src/)
; 注意: src_dir 只能写在 [platformio] 段, 写进 [env:] 会被 PIO 报
; "Ignore unknown configuration option" 然后去找不存在的 src/ 目录
src_dir = main
