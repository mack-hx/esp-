; PlatformIO Project Configuration File
;
;   ESP32-S3R8N8 平衡轮腿可分离机械狗
;   主控：ESP32-S3R8N8
;   PSRAM：8MB Octal SPI
;   Flash：8MB
;
;   ⚠ 分区表说明（重要）
;   PlatformIO 的 ESP-IDF 框架 *不读* 本文件里的 board_build.partitions，
;   它只读 board 定义 JSON 里的 build.partitions 键。
;   官方 esp32-s3-devkitc-1.json 里这个键只写在 build.arduino 子对象里（只有 Arduino 框架用），
;   所以之前写的 board_build.partitions 被静默忽略，板子退回 1MB 单应用分区，只剩约 200KB。
;   现在改用自定义 board: esp32-s3r8n8-8mb
;   （JSON 放在 ~/.platformio/boards/esp32-s3r8n8-8mb.json，已在 build 顶层加了 "partitions": "partitions.csv"）
;
;   8MB Flash 新分区表（见 partitions.csv）:
;     nvs 24K / otadata 8K / phy_init 4K / ota_0 3584K / ota_1 3584K / storage 896K

[env:esp32-s3-devkitc-1]
; 固定 platform 版本到 6.5.0 (已安装)
; 原因: 最新版 espressif32 (7.1.3) 要求的 toolchain-riscv32-esp @ 14.2.0+20251107
; 在 PlatformIO Registry 不存在 (官方最新是 15.2.0+20251204),
; PIO 会陷入死循环重试不存在的 URL.
; 6.5.0 依赖 toolchain-riscv32-esp @ 8.4.0+2021r2-patch5, 但 8.4.0 没有
; darwin_arm64 版本 (Apple Silicon); 我们手动升级到 12.2.0 (有 arm64).
platform = espressif32@~6.5.0
board = esp32-s3r8n8-8mb
framework = espidf

; 强制使用 darwin_arm64 支持的工具链版本
platform_packages =
    toolchain-riscv32-esp@12.2.0+20230208
    toolchain-xtensa-esp32s3@12.2.0+20230208

; Flash settings - ESP32-S3R8N8 配置
; 注意: 下面两行只对 Arduino 框架有效, ESP-IDF 下 flash size 由 board JSON 的
; upload.flash_size (8MB) + sdkconfig 的 ESPTOOLPY_FLASHSIZE 决定, 保持一致即可
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.flash_mode = qio

; PSRAM: 8MB Octal SPI PSRAM
board_build.psram_type = opi
board_build.arduino.memory_type = opi_opi

; Serial monitor
monitor_speed = 230400
monitor_filters = esp32_exception_decoder

; JTAG 调试 (pio debug)
; 设备枚举为 "USB JTAG/serial debug unit" (VID:PID 303A:1001) = 插的是
; ESP32-S3 的**原生 USB 口**, 芯片自带 USB-JTAG, 不用外接 ESP-PROG 探针。
; ⚠ 调试固件会独占这个 USB 口: 跑 pio debug 时串口日志 (TRACE) 收不到,
;   所以调试和抓 TRACE 要分开做。
debug_tool = esp-builtin

; Upload settings - 解决烧录后串口断开问题
upload.speed = 460800
upload.wait_for_upload_port = true

[platformio]
; 工程源码目录: main/ (ESP-IDF 标准布局, 覆盖 PlatformIO 默认 src/)
; 注意: src_dir 只能写在 [platformio] 段, 写进 [env:] 会被 PIO 报
; "Ignore unknown configuration option" 然后去找不存在的 src/ 目录
src_dir = main
